name: Release

# A version tag such as 1.0.0 builds the AppImage and the RPM and publishes
# them as that tag's GitHub release. The tag must match package.json.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      # electron-builder's rpm target runs fpm, which needs rpmbuild.
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Checksums
        working-directory: dist
        run: sha256sum *.AppImage *.rpm > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Airlock Browser $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.AppImage dist/*.rpm dist/SHA256SUMS

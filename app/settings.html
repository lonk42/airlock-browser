<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>Airlock Browser settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <header>
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M5 20.5v-10a7 7 0 0 1 14 0v10zM11.3 6v14.5h1.4V6z"/></svg>
    <h1>Airlock Browser settings</h1>
    <p id="intro" class="muted"></p>
    <p id="locked-note" class="muted" hidden>Greyed-out settings are set by the --config file.</p>
  </header>

  <form id="form" novalidate>
    <section>
      <h2>Site</h2>
      <label for="url">Address</label>
      <input id="url" name="url" type="url" spellcheck="false" autocomplete="off">
      <p id="url-note" class="note"></p>
    </section>

    <section>
      <h2>Window</h2>
      <label for="display">Monitor</label>
      <select id="display" name="display"></select>
      <p id="display-note" class="note"></p>
      <fieldset>
        <legend>Size</legend>
        <div class="segmented">
          <label><input type="radio" name="windowMode" value="normal"><span>Window</span></label>
          <label><input type="radio" name="windowMode" value="maximized"><span>Maximised</span></label>
          <label><input type="radio" name="windowMode" value="fullscreen"><span>Fullscreen</span></label>
        </div>
      </fieldset>
    </section>

    <section>
      <h2>Keyboard</h2>
      <label class="check">
        <input id="captureKeys" name="captureKeys" type="checkbox">
        <span>Send window-manager shortcuts such as Alt+Tab to the desktop while Airlock Browser has focus</span>
      </label>
      <p id="capture-note" class="note"></p>
    </section>

    <section>
      <h2>Integration</h2>
      <p id="wm-note" class="note"></p>
      <ul id="items"></ul>
      <p id="error" class="error" role="alert" hidden></p>
    </section>
  </form>

  <footer>
    <p class="muted keys">Ctrl+Alt+Shift+S closes settings · Ctrl+Alt+Shift+Q quits</p>
    <button type="button" id="cancel">Cancel</button>
    <button type="submit" id="save" form="form" class="primary">Save</button>
  </footer>
</main>
<script src="settings-ui.js"></script>
</body>
</html>
